<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 图片 / 视频 生成工作台</title>
  <meta name="description" content="AI 图片与视频生成工作台 - Nano Banana 生图 + Grok 视频" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="particles-canvas"></canvas>

  <!-- 顶部导航 -->
  <header class="top-bar">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <polyline points="21 15 16 10 5 21" />
      </svg>
      <span class="logo-text">AI 创作工作台</span>
    </div>
    <div class="top-bar-right">
      <div class="status-dot online"></div>
      <span class="status-text">服务在线</span>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- ==================== 左侧面板 ==================== -->
    <section class="panel panel-config" id="config-panel">
      <div class="panel-header">
        <h2 class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="panel-icon"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
          生成配置
        </h2>
      </div>

      <div class="panel-body">
        <!-- ===== 图片 API Key (PearAPI) ===== -->
        <div class="form-group">
          <label class="form-label" for="input-key">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" /></svg>
            图片 API Key <span class="label-sub">(PearAPI)</span>
          </label>
          <input type="password" id="input-key" class="form-input" placeholder="用于 Nano Banana 生图" autocomplete="off" />
          <button class="btn-toggle-key" id="btn-toggle-key" title="显示/隐藏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
          </button>
        </div>

        <!-- ===== 视频 API Key (yijiarj) ===== -->
        <div class="form-group">
          <label class="form-label" for="input-video-key">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon"><polygon points="23 7 16 12 23 17 23 7" /><rect x="1" y="5" width="15" height="14" rx="2" ry="2" /></svg>
            视频 API Key <span class="label-sub">(Grok Video)</span>
          </label>
          <input type="password" id="input-video-key" class="form-input" placeholder="用于 Grok 视频生成" autocomplete="off" />
          <button class="btn-toggle-key" id="btn-toggle-video-key" title="显示/隐藏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></svg>
          </button>
        </div>

        <!-- ===== 视频 API 线路 ===== -->
        <div class="form-group">
          <label class="form-label" for="select-video-server">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon"><path d="M12 2L2 7l10 5 10-5-10-5z" /><path d="M2 17l10 5 10-5" /><path d="M2 12l10 5 10-5" /></svg>
            视频 API 线路
          </label>
          <select id="select-video-server" class="form-select">
            <option value="https://api.yijiarj.cn">国内(大带宽)</option>
            <option value="https://ai.yijiarj.cn">国内(小带宽)</option>
            <option value="https://apius.yijiarj.cn">美国线路</option>
          </select>
        </div>

        <!-- 分隔 -->
        <hr class="config-divider" />

        <!-- ===== 图片模型 ===== -->
        <div class="form-group">
          <label class="form-label" for="select-model">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon"><rect x="2" y="3" width="20" height="14" rx="2" ry="2" /><line x1="8" y1="21" x2="16" y2="21" /><line x1="12" y1="17" x2="12" y2="21" /></svg>
            图片模型
          </label>
          <select id="select-model" class="form-select">
            <optgroup label="Nano Banana 系列">
              <option value="nano-banana-2-4k">2 4K (¥0.16 · 高速高分辨率)</option>
              <option value="nano-banana-2" selected>2 (¥0.12 · 快速精准)</option>
            </optgroup>
          </select>
        </div>

        <!-- 图像尺寸 -->
        <div class="form-group">
          <label class="form-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon"><rect x="2" y="2" width="20" height="20" rx="2" ry="2" /><line x1="2" y1="12" x2="22" y2="12" /><line x1="12" y1="2" x2="12" y2="22" /></svg>
            图像尺寸
          </label>
          <div class="ratio-group" id="ratio-group">
            <button class="ratio-btn active" data-ratio="16:9"><div class="ratio-preview r-16-9"></div><span>16:9</span></button>
            <button class="ratio-btn" data-ratio="9:16"><div class="ratio-preview r-9-16"></div><span>9:16</span></button>
            <button class="ratio-btn" data-ratio="1:1"><div class="ratio-preview r-1-1"></div><span>1:1</span></button>
            <button class="ratio-btn" data-ratio="4:3"><div class="ratio-preview r-4-3"></div><span>4:3</span></button>
            <button class="ratio-btn" data-ratio="auto"><div class="ratio-preview r-auto">A</div><span>自动</span></button>
          </div>
        </div>

        <!-- 参考图片 -->
        <div class="form-group">
          <label class="form-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><circle cx="8.5" cy="8.5" r="1.5" /><polyline points="21 15 16 10 5 21" /></svg>
            参考图片 <span class="label-sub">(最多8张, 选填)</span>
          </label>
          <div class="image-drop-zone" id="image-drop-zone">
            <input type="file" id="image-file-input" accept="image/*" multiple hidden />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="drop-icon"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></svg>
            <p class="drop-text">拖拽图片到此处，或 <span class="drop-link">点击上传</span></p>
            <p class="drop-hint">支持 JPG / PNG / WebP</p>
          </div>
          <div class="image-preview-list" id="image-preview-list"></div>
          <p class="image-tip" id="image-tip" style="display:none">💡 提示词中用"图片1""图片2"引用对应参考图</p>
        </div>

        <!-- 提示词 -->
        <div class="form-group">
          <label class="form-label" for="input-prompt">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon"><line x1="17" y1="10" x2="3" y2="10" /><line x1="21" y1="6" x2="3" y2="6" /><line x1="21" y1="14" x2="3" y2="14" /><line x1="17" y1="18" x2="3" y2="18" /></svg>
            提示词
          </label>
          <textarea id="input-prompt" class="form-textarea" rows="5" placeholder="描述你想要生成的图片内容..."></textarea>
          <div class="char-count"><span id="char-count">0</span> 字</div>
        </div>

        <!-- 生成按钮组 -->
        <div class="btn-group">
          <button class="btn-submit" id="btn-submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon-svg"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><polyline points="21 15 16 10 5 21" /></svg>
            <span>生成图片</span>
          </button>
          <button class="btn-submit btn-video-submit" id="btn-open-video-dialog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon-svg"><polygon points="23 7 16 12 23 17 23 7" /><rect x="1" y="5" width="15" height="14" rx="2" ry="2" /></svg>
            <span>生成视频</span>
          </button>
        </div>
      </div>
    </section>

    <!-- ==================== 右侧面板 ==================== -->
    <section class="panel panel-result" id="result-panel">
      <div class="panel-header">
        <h2 class="panel-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="panel-icon"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></svg>
          生成记录
        </h2>
        <div class="task-count" id="task-count">0 个任务</div>
      </div>
      <div class="panel-body" id="task-list-container">
        <div class="empty-state" id="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="empty-icon"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><circle cx="8.5" cy="8.5" r="1.5" /><polyline points="21 15 16 10 5 21" /></svg>
          <p class="empty-title">暂无任务</p>
          <p class="empty-desc">配置参数并提交，开始 AI 创作</p>
        </div>
        <div class="task-list" id="task-list"></div>
      </div>
    </section>
  </main>

  <!-- ==================== Toast ==================== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ==================== 图片预览模态框 ==================== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
      </button>
      <img id="modal-image" class="modal-image" alt="生成的图片" />
      <div class="modal-actions">
        <a id="modal-download" class="btn-download" href="#" download target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>
          下载图片
        </a>
      </div>
    </div>
  </div>

  <!-- ==================== 视频播放模态框 ==================== -->
  <div class="modal-overlay" id="video-modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="video-modal-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
      </button>
      <video id="modal-video" class="modal-video" controls autoplay></video>
      <div class="modal-actions">
        <a id="video-modal-download" class="btn-download" href="#" download target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>
          下载视频
        </a>
      </div>
    </div>
  </div>

  <!-- ==================== 视频生成对话框 ==================== -->
  <div class="vdialog-overlay" id="vdialog-overlay">
    <div class="vdialog">
      <div class="vdialog-header">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="panel-icon"><polygon points="23 7 16 12 23 17 23 7" /><rect x="1" y="5" width="15" height="14" rx="2" ry="2" /></svg>
          从图片生成视频
        </h3>
        <button class="modal-close" id="vdialog-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>
        </button>
      </div>
      <div class="vdialog-body">
        <!-- 参考图预览 -->
        <div class="vdialog-ref">
          <img id="vdialog-ref-img" src="" alt="参考图片" />
          <div class="vdialog-ref-label">参考图 (@图一)</div>
        </div>

        <div class="vdialog-grid">
          <!-- 视频模型 -->
          <div class="form-group">
            <label class="form-label">视频模型</label>
            <select id="select-video-model" class="form-select">
              <option value="grok-imagine-1.0-video-super" selected>Grok Video Super (高质量)</option>
            </select>
          </div>
          <!-- 时长 -->
          <div class="form-group">
            <label class="form-label">时长</label>
            <select id="select-video-length" class="form-select">
              <option value="10" selected>10 秒</option>
            </select>
          </div>
          <!-- 比例 -->
          <div class="form-group">
            <label class="form-label">画面比例</label>
            <select id="select-video-ratio" class="form-select">
              <option value="16:9">16:9 横屏</option>
              <option value="9:16">9:16 竖屏</option>
              <option value="1:1">1:1 方形</option>
              <option value="2:3">2:3</option>
              <option value="3:2">3:2</option>
            </select>
          </div>
          <!-- 风格 -->
          <div class="form-group">
            <label class="form-label">风格预设</label>
            <select id="select-video-preset" class="form-select">
              <option value="normal" selected>Normal 标准</option>
              <option value="fun">Fun 有趣</option>
              <option value="spicy">Spicy 劲爆</option>
              <option value="custom">Custom 自定义</option>
            </select>
          </div>
          <!-- 分辨率 -->
          <div class="form-group">
            <label class="form-label">分辨率</label>
            <select id="select-video-resolution" class="form-select">
              <option value="720p" selected>720p</option>
              <option value="480p">480p</option>
            </select>
          </div>
        </div>

        <!-- 视频提示词 -->
        <div class="form-group">
          <label class="form-label">视频提示词</label>
          <textarea id="input-video-prompt" class="form-textarea" rows="3" placeholder="描述视频画面动态...用 @图一 引用参考图">让@图一中的画面动起来</textarea>
        </div>

        <button class="btn-submit btn-video-submit" id="btn-submit-video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon-svg"><polygon points="23 7 16 12 23 17 23 7" /><rect x="1" y="5" width="15" height="14" rx="2" ry="2" /></svg>
          <span>开始生成视频</span>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
