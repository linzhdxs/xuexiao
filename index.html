<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seedance 视频生成工作台</title>
  <meta name="description" content="Seedance 单模型视频生成工作台" />
  <link rel="stylesheet" href="style.css?v=20260712-seedance" />
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Z" />
          <path d="m17 9 4-2v10l-4-2" />
          <path d="M8 9h5M8 13h4" />
        </svg>
      </div>
      <div>
        <strong>Seedance 视频工作台</strong>
        <span>单模型生成</span>
      </div>
    </div>
    <div class="service-pill" id="service-status">
      <span class="status-dot"></span>
      <span>服务待命</span>
    </div>
  </header>

  <main class="app-shell">
    <section class="composer-panel" aria-labelledby="composer-title">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Create</p>
          <h1 id="composer-title">生成视频</h1>
        </div>
        <div class="model-chip">
          <span>Seedance 2.0</span>
        </div>
      </div>

      <div class="model-strip">
        <div class="model-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v18" />
            <path d="M3 12h18" />
            <path d="m5 5 14 14" />
            <path d="m19 5-14 14" />
          </svg>
        </div>
        <div>
          <span class="field-label">当前模型</span>
          <select id="select-video-model" class="form-select compact" aria-label="视频模型">
            <option value="seedance-2.0" selected>Seedance 2.0</option>
          </select>
        </div>
      </div>

      <div class="form-grid">
        <label class="field">
          <span class="field-label">比例</span>
          <select id="select-video-ratio" class="form-select">
            <option value="16:9">16:9 横屏</option>
            <option value="9:16">9:16 竖屏</option>
            <option value="1:1">1:1 方形</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">时长</span>
          <select id="select-video-seconds" class="form-select">
            <option value="5" selected>5 秒</option>
            <option value="10">10 秒</option>
          </select>
        </label>
      </div>

      <label class="field prompt-field" for="input-video-prompt">
        <span class="field-label">提示词</span>
        <textarea id="input-video-prompt" class="form-textarea" rows="9" maxlength="2000" placeholder="例如：清晨的校园操场，阳光穿过树影，镜头缓慢推进，学生整理社团展示牌"></textarea>
      </label>
      <div class="prompt-meta"><span id="char-count">0</span>/2000</div>

      <button class="btn-primary" id="btn-submit-video" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <polygon points="5 3 19 12 5 21 5 3" />
        </svg>
        <span>生成视频</span>
      </button>
    </section>

    <section class="history-panel" aria-labelledby="history-title">
      <div class="panel-heading history-heading">
        <div>
          <p class="eyebrow">Queue</p>
          <h2 id="history-title">生成记录</h2>
        </div>
        <div class="history-actions">
          <span class="task-count" id="task-count">0 个任务</span>
          <button class="btn-ghost" id="btn-clear-completed" type="button" title="清理已完成任务" aria-label="清理已完成任务">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="m19 6-1 14H6L5 6" />
              <path d="M10 11v5M14 11v5" />
            </svg>
          </button>
        </div>
      </div>
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <rect x="4" y="5" width="16" height="14" rx="2" />
          <path d="m10 9 5 3-5 3V9Z" />
        </svg>
        <p>暂无生成记录</p>
      </div>
      <div class="task-list" id="task-list"></div>
    </section>
  </main>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <div class="modal-overlay" id="video-modal-overlay" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-label="视频预览">
      <button class="modal-close" id="video-modal-close" type="button" aria-label="关闭预览">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
      <video id="modal-video" class="modal-video" controls playsinline></video>
      <a id="video-modal-download" class="btn-download" href="#" download target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3v12" />
          <path d="m7 10 5 5 5-5" />
          <path d="M5 21h14" />
        </svg>
        <span>下载</span>
      </a>
    </div>
  </div>

  <script src="app.js?v=20260712-seedance"></script>
</body>
</html>
